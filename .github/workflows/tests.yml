name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: motaxle-jinchen-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Unit tests
        run: python3 -m unittest discover tests -v
      - name: Inbox is clean
        run: test -z "$(git status --porcelain --ignored -- inbox)"
      - name: Proof
        run: python3 prove.py
