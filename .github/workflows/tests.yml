name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: motaxle-jinchen-connector
    steps:
      - id: checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Unit tests
        run: python3 -m unittest discover tests -v
      - name: Proof
        run: python3 prove.py
      - name: Working tree is clean
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          out=$(git status --porcelain --ignored)
          echo "$out"
          test -z "$out"
